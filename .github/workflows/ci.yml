name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install client deps
        working-directory: ./client
        run: |
          npm ci

      - name: Run frontend tests
        working-directory: ./client
        run: |
          npm test --if-present
name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ./.wheelhouse
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          # try to install from a cached wheelhouse first
          if [ -d ./.wheelhouse ]; then
            pip install --no-index --find-links ./.wheelhouse -r requirements.txt || true
          fi
          # fallback to normal install (and build wheels)
          pip install -r requirements.txt
          mkdir -p ./.wheelhouse
          pip wheel --wheel-dir=./.wheelhouse -r requirements.txt || true
          pip install pre-commit

      - name: Run pre-commit (lint & format checks)
        run: |
          . .venv/bin/activate
          pre-commit run --all-files

      - name: Run ruff (explicit check)
        run: |
          . .venv/bin/activate
          .venv/bin/ruff check .

      - name: Run Black (explicit format check)
        run: |
          . .venv/bin/activate
          .venv/bin/black --check .

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          . .venv/bin/activate
          .venv/bin/pytest -q

  frontend:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('client/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: client
        run: |
          npm ci

      - name: Build frontend
        working-directory: client
        run: |
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
