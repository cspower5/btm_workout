name: E2E Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  # Optional: run on deployment events if your host can emit them
  deployment:
    types: [created]

jobs:
  e2e:
    # Give the job a bit more headroom and avoid accidental cancellation.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Use a concurrency group that isolates manual dispatch runs so they don't
    # cancel each other. For push events we keep the ref-based group to avoid
    # overlapping branch runs.
    concurrency:
      group: e2e-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
      cancel-in-progress: false
    strategy:
      # Reduce matrix size during debug to speed iteration; expand when stable.
      matrix:
        body_part: [ chest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vite expects newer Node versions; use Node 20 for CI to match
          # modern toolchains and avoid warnings / subtle runtime diffs.
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            client/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci --silent

      - name: Setup Playwright browsers (system deps + Chromium)
        uses: microsoft/playwright-github-action@v1
        with:
          install-deps: true
          browsers: chromium

      - name: Install project Puppeteer deps
        # Keep Puppeteer for the existing e2e_check.js script; Playwright step
        # ensures system libs and a Chromium binary are available which speeds
        # browser startup and reduces failures on CI images.
        run: npm install puppeteer axios --no-audit --no-fund --silent

      - name: Build client
        working-directory: ./client
        run: npm run build --silent

      - name: Serve built site
        run: npx http-server ./client/dist -p 8080 -c-1 & sleep 2

      - name: Run E2E check
        env:
          TEST_BASE: http://localhost:8080/btm_workout
          TEST_API: https://btm-workout.onrender.com
          FLASK_ALLOW_DEV_ORIGINS: '0'
          BODY_PART: ${{ matrix.body_part }}
          NUM_EX: 3
        run: node scripts/e2e_check.js
