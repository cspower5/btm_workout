name: E2E Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  # Optional: run on deployment events if your host can emit them
  deployment:
    types: [created]

jobs:
  e2e:
    # Give the job a bit more headroom and avoid accidental cancellation.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Use a concurrency group that isolates manual dispatch runs so they don't
    # cancel each other. For push events we keep the ref-based group to avoid
    # overlapping branch runs.
    concurrency:
      group: e2e-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
      cancel-in-progress: false
    strategy:
      # Reduce matrix size during debug to speed iteration; expand when stable.
      matrix:
        body_part: [ chest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vite expects newer Node versions; use Node 20 for CI to match
          # modern toolchains and avoid warnings / subtle runtime diffs.
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            client/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci --silent

      - name: Install project Puppeteer deps
        working-directory: ./client
        run: |
          # Install project deps (Puppeteer is kept for the existing e2e_check.js)
          npm install puppeteer axios --no-audit --no-fund --silent

      - name: Install root dependencies for E2E script
        run: |
          # The E2E script lives at scripts/e2e_check.js and imports puppeteer from
          # the repository root. Use npm ci for reproducible, faster installs in CI.
          npm ci --silent --no-audit --no-fund || npm install --silent --no-audit --no-fund

      - name: Install Playwright system deps & Chromium (safer on ubuntu-24.04)
        working-directory: ./client
        run: |
          # Use npx to install system dependencies and the Chromium browser for Playwright.
          # This is recommended over the deprecated action and works on ubuntu-24.04.
          npx playwright install-deps || true
          npx playwright install chromium --with-deps || true

      - name: Build client
        working-directory: ./client
        run: npm run build --silent

      - name: Check dependency imports (fast-fail)
        # Run from both root and client to diagnose resolution issues quickly.
        # Prefer puppeteer-core if available, otherwise fall back to puppeteer.
        run: |
          echo 'Checking dynamic import resolution at repo root...'
          node -e "(async ()=>{ try{ try{ await import('puppeteer-core'); console.log('root: puppeteer-core ok'); }catch(_){ await import('puppeteer'); console.log('root: puppeteer ok'); } }catch(e){ console.error('root: puppeteer import failed:', e.message); process.exit(3);} })()"
          node -e "(async ()=>{ try{ await import('axios'); console.log('root: axios ok'); }catch(e){ console.error('root: axios import failed:', e.message); process.exit(3);} })()"
          echo 'Checking dynamic import resolution from client working dir...'
          (cd client && node -e "(async ()=>{ try{ try{ await import('puppeteer-core'); console.log('client: puppeteer-core ok'); }catch(_){ await import('puppeteer'); console.log('client: puppeteer ok'); } }catch(e){ console.error('client: puppeteer import failed:', e.message); process.exit(4);} })()")
          (cd client && node -e "(async ()=>{ try{ await import('axios'); console.log('client: axios ok'); }catch(e){ console.error('client: axios import failed:', e.message); process.exit(4);} })()")

      - name: Serve built site
        run: |
          # Serve the built client and wait briefly for the server to be ready.
          npx http-server ./client/dist -p 8080 -c-1 &
          # give the server a bit more time on CI images
          sleep 5

      - name: Run E2E check
        env:
          # Serve root URL (http://localhost:8080). The built index.html uses
          # absolute paths like /btm_workout/assets/...; serving at root makes
          # those asset URLs resolve correctly under http-server.
          TEST_BASE: http://localhost:8080
          TEST_API: https://btm-workout.onrender.com
          FLASK_ALLOW_DEV_ORIGINS: '0'
          BODY_PART: ${{ matrix.body_part }}
          NUM_EX: 3
        working-directory: ./client
        run: |
          # Run the small wrapper which validates modules and launches the e2e script
          node ../scripts/run_e2e_with_fallbacks.mjs

      - name: Upload E2E snapshots (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-snapshots-${{ matrix.body_part }}
          path: |
            /tmp/e2e_page_snapshot.png
            /tmp/e2e_page_snapshot.html
            /tmp/e2e_console_log.txt
