name: Visual Screenshot

on:
  workflow_dispatch: {}

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install client deps
        working-directory: client
        run: |
          npm ci

      - name: Build client
        working-directory: client
        run: |
          npm run build

      - name: Install puppeteer
        working-directory: client
        run: npm install puppeteer --no-audit --no-fund

      - name: Run screenshot capture
        working-directory: client
        env:
          PORT: 8080
        run: |
          # Run the serve_with_prefix server in background
          node serve_with_prefix.cjs >/tmp/serve.log 2>&1 &
          sleep 2
          # Run the debug capture script which writes /tmp/mobile_debug_screenshot.png
          node mobile_shot_debug.cjs > /tmp/mobile_debug_run.log 2>&1 || true

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-screenshot
          path: /tmp/mobile_debug_screenshot.png
