name: E2E (proxy + Puppeteer)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  e2e-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install client deps
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Start proxy server
        run: |
          python3 scripts/proxy_btm_server.py --host 127.0.0.1 --port 5174 &
          sleep 1

      - name: Run E2E smoke test
        env:
          TEST_BASE: http://127.0.0.1:5174/btm_workout
        run: |
          node scripts/e2e_check.js --base $TEST_BASE --headless --save-artifacts --timeout 60000

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            /tmp/e2e_page_snapshot.html
            /tmp/e2e_page_snapshot.png
